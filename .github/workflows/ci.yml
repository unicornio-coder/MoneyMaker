name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: poner la etiqueta "publicar" después de abrir el PR vuelve a correr el CI con la etiqueta a la vista.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_USE_MOCK: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, móvil y escritorio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: calidad
    env:
      NEXT_PUBLIC_USE_MOCK: 'true'
      MOCK_SIN_DEMO: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: |
            test-results/capturas
            playwright-report
          retention-days: 7

  # Bot de publicación: cuando lint, tipos, pruebas, build y E2E están en verde y el PR trae la etiqueta
  # "publicar", se fusiona solo a main y Vercel despliega. Así un cambio llega a la página sin pasos manuales.
  publicar:
    name: Fusionar a main si el PR lleva "publicar"
    runs-on: ubuntu-latest
    needs: [calidad, e2e]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publicar')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fusionar
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, merge_method: 'merge', commit_title: `${pr.title} (#${pr.number})` });
            core.info(`PR #${pr.number} fusionado a main.`);
