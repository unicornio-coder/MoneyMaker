name: Producción

# Vercel despliega desde la rama `claude/gallant-bohr-re8e7b`, no desde `main`. Mientras eso no cambie en Vercel
# (Settings → Git → Production Branch = main), este workflow replica `main` a esa rama en cada merge, así un solo
# PR a `main` ya publica. Cuando la rama de producción sea `main`, este archivo se puede borrar.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  replicar:
    name: main → rama de producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Empujar main a la rama que despliega Vercel
        env:
          RAMA_PRODUCCION: claude/gallant-bohr-re8e7b
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # La rama de producción queda idéntica a main (los merges anteriores de "Producción: fase N" ya están en main).
          git push --force-with-lease=refs/heads/$RAMA_PRODUCCION origin "HEAD:refs/heads/$RAMA_PRODUCCION" \
            || git push --force origin "HEAD:refs/heads/$RAMA_PRODUCCION"
          echo "Producción = $(git rev-parse --short HEAD)"
